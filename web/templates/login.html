<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flor de Recetas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="pagina">
        <div class="masthead">
            <div class="marca">Flor de Recetas</div>
            <div class="tagline">Recomendaciones hechas a tu medida</div>
        </div>
        <hr class="regla">

        <div class="login-caja">
            <form method="POST" action="/">
                <input type="text" name="username" placeholder="Tu nombre de usuario" required autofocus>
                <button type="submit">Entrar</button>
            </form>
            <p class="nota">¿Primera vez acá? Escribí el nombre que quieras usar — te creamos la cuenta al toque y arrancamos por lo más popular.</p>
        </div>
    </div>
</body>
</html>
